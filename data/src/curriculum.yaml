# The curriculum spine. Generated downstream by tools/gen_curriculum_index.py; never hand-copy a
# number from here into prose — lesson ids are the contract, values come from data/gen/.
schema_version: "1.0.0"
engine_version: "0.1.0"

lesson_template:
  - "本节目标 / Objectives"
  - "前置知识 / Prerequisites"
  - "核心原理 / The principle"
  - "推导 / Derivation"
  - "直觉 / Intuition"
  - "算例 / Worked examples"
  - "生成表 / Generated tables"
  - "实战牌局 / Live hands"
  - "范围图 / Range chart"
  - "为何成立、何时失效 / Why it works, when it breaks"
  - "陷阱 / Common mistakes"
  - "练习 / Drills"
  - "自测清单 / Self-check"
  - "来源与置信度 / Provenance and confidence"
  - "术语 / Terms"

chapters:
  - id: "00"
    order: 0
    slug: 00-orientation
    title:
      zh: "导论"
      en: "Orientation"
    summary:
      zh: "先讲清这套教材怎么用：术语、结构、来源标注，以及为什么数字必须由引擎生成。"
      en: "How the repository is read: vocabulary, the fixed lesson template, provenance, and why numbers are generated rather than typed."
    tags:
      scenario: [shared]
      streets: [n-a]
    lessons:
      - id: "00-01"
        order: 1
        slug: how-to-use-this-repo
        title:
          zh: "怎么读这套教材：底牌、牌面、四条街与位置名称"
          en: "How to use this curriculum: hole cards, board, the four streets and position names"
        objective:
          zh: "能说出一个课节的固定分节结构、AUTO 表块的数字从哪来，以及每个基础动作术语在本仓库里的唯一写法。"
          en: "State the fixed section order of a lesson, where an AUTO table's numbers come from, and the one sanctioned spelling of each basic action term."
        tags:
          scenario: [shared]
          streets: [n-a]
          concepts: [hole-cards, board, street, preflop, flop, turn, river, pot, bet, raise, call, fold, check, hero, villain, six-max, position, button, small-blind, big-blind]
        prereq: []
        status_zh: ready
        status_en: ready
      - id: "00-02"
        order: 2
        slug: derivation-over-memory
        title:
          zh: "先推导再记忆：一个数字必须能被引擎重算出来"
          en: "Derivation before memory: every number must be recomputable by the engine"
        objective:
          zh: "能区分 derived、reference、external 三类来源，并解释一条标注为未核验的结论为什么仍然可以保留在课节里。"
          en: "Distinguish derived, reference and external provenance, and explain why an UNVERIFIED claim may still stay in a lesson."
        tags:
          scenario: [shared]
          streets: [n-a]
          concepts: [gto, nash-equilibrium, exploitability, best-response, provenance, unverified-claim, derivation-ref]
        prereq: ["00-01"]
        status_zh: ready
        status_en: ready
      - id: "00-03"
        order: 3
        slug: setup-and-toolchain
        title:
          zh: "装好工具链：命令行、随机种子与确定性输出"
          en: "Set up the toolchain: the CLI, random seeds and deterministic output"
        objective:
          zh: "能在本地跑通一条引擎命令并复述：为什么同一命令在两台机器上必须产出逐字节相同的结果。"
          en: "Run one engine command locally and explain why it must emit byte-identical output on every machine."
        tags:
          scenario: [shared]
          streets: [n-a]
          concepts: [solver, determinism, generated-artifact, single-source-of-truth, rng-seed]
        prereq: ["00-01", "00-02"]
        status_zh: ready
        status_en: ready

  - id: "01"
    order: 1
    slug: 01-combinatorics-equity
    title:
      zh: "组合数学与胜率"
      en: "Combinatorics and Equity"
    summary:
      zh: "把牌局还原成可数的对象：组合、移除效应、精确胜率、模拟误差与牌力评估。"
      en: "Reduce a hand to countable objects: combos, removal effects, exact equity, simulation error and hand evaluation."
    tags:
      scenario: [shared]
      streets: [preflop, flop, turn, river]
    lessons:
      - id: "01-01"
        order: 1
        slug: combos-from-1326-to-169
        title:
          zh: "从起手组合到手牌类别：每一类到底有几个组合"
          en: "From hole combos to hand classes: how many combos each class really has"
        objective:
          zh: "能写出按类别推算组合数的方法，并用引擎的逐类枚举核对整张计数表。"
          en: "Compute combos class by class from first principles and check the whole count table against the engine's enumeration."
        tags:
          scenario: [shared]
          streets: [preflop]
          concepts: [combos, hand-class, suited, offsuit, pocket-pair, hole-cards]
        prereq: ["00-01", "00-02"]
        status_zh: ready
        status_en: ready
      - id: "01-02"
        order: 2
        slug: blockers-and-card-removal
        title:
          zh: "阻断牌与移除效应：一张牌如何改掉对手的组合计数"
          en: "Blockers and removal effects: how one card rewrites the opponent's combo count"
        objective:
          zh: "能用移除效应算出持有某张牌后，对手某一类别减少的组合数，并说明这类信息何时值得利用。"
          en: "Quantify how holding a given card deletes combos from an opponent class, and say when that information is worth acting on."
        tags:
          scenario: [shared]
          streets: [multi-street]
          concepts: [blocker, removal-effect, combos, hand-class, range]
        prereq: ["01-01"]
        status_zh: ready
        status_en: ready
      - id: "01-03"
        order: 3
        slug: exact-equity-by-enumeration
        title:
          zh: "穷举胜率：把补牌数换成每一街的精确概率"
          en: "Exact equity by enumeration: turning outs into per-street probabilities"
        objective:
          zh: "能用穷举得到含平分的胜率，并指出它与补牌 shortcuts 在哪些牌面上差距最大。"
          en: "Enumerate equity including chopped pots, and identify the boards where the outs shortcut diverges most."
        tags:
          scenario: [shared]
          streets: [flop, turn, river]
          concepts: [equity, win-probability, outs, rule-of-two-and-four, tie-chop, showdown]
        prereq: ["01-01", "01-02"]
        status_zh: ready
        status_en: ready
      - id: "01-04"
        order: 4
        slug: monte-carlo-variance-and-seeds
        title:
          zh: "模拟误差从哪来：方差、标准误与固定种子"
          en: "Monte Carlo error: variance, standard error and pinned seeds"
        objective:
          zh: "能说明模拟次数与标准误的关系，并解释为什么每张生成表都要记录种子。"
          en: "Relate simulation count to standard error, and explain why every generated table records its seed."
        tags:
          scenario: [shared]
          streets: [n-a]
          concepts: [monte-carlo-simulation, variance, standard-error, rng-seed, sample-size, determinism]
        prereq: ["01-03", "00-03"]
        status_zh: ready
        status_en: ready
      - id: "01-05"

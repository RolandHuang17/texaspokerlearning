        slug: the-seven-card-evaluator
        title:
          zh: "七张牌评估器：牌型归类与踢脚判定的边界情形"
          en: "The seven-card evaluator: hand classification and kicker tie-breaks"
        objective:
          zh: "能说明评估器为何要在七张牌的所有五张子手里取最优，并解释它对平分底池返回什么。"
          en: "Explain why the evaluator takes the best five-card subset of seven, and what it returns for a chopped pot."

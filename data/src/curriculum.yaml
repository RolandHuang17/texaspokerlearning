          scenario: [shared]
          streets: [flop, turn, river]
          concepts: [hand-ranking, hand-strength, kicker, showdown, flush, straight, trips, full-house]
        prereq: ["01-01"]
        status_zh: ready
        status_en: ready
      - id: "01-06"
        order: 6
        slug: equity-realization-vs-raw-equity
        title:
          zh: "胜率不等于拿到手的钱：胜率实现为何低于名义胜率"
          en: "Equity is not money: why realization falls short of raw equity"
        objective:
          zh: "能列出压低胜率实现的结构性原因，并指出哪一类手牌最容易实现不足。"
          en: "List the structural reasons realization undershoots raw equity and name the hand class that under-realises most."

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokergto"
version = "0.1.0"
description = "A bilingual, runnable GTO first-principles curriculum for no-limit Texas Hold'em: every number is derived, not asserted."
readme = "README.md"
requires-python = ">=3.11"
# Code is MIT; prose and data are CC BY-SA 4.0. See NOTICE for the split and the
# "no proprietary solver output" rule.
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Roland Huang", email = "roland.huang@example.com" },
]
keywords = ["poker", "texas-holdem", "gto", "game-theory", "cfr", "icm", "education", "bilingual"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment :: Board Games",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6",
  "jsonschema>=4",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4",
  "ruff>=0.4",
  "mypy>=1.8",
  "pre-commit>=3.6",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "pymdown-extensions>=10",
]
plot = [
  "matplotlib>=3.8",
]

[project.scripts]
poker = "pokergto.cli:main"

[project.urls]
Homepage = "https://github.com/RolandHuang17/texaspokerlearning"
Repository = "https://github.com/RolandHuang17/texaspokerlearning"
Documentation = "https://RolandHuang17.github.io/texaspokerlearning/"
Issues = "https://github.com/RolandHuang17/texaspokerlearning/issues"
Changelog = "https://github.com/RolandHuang17/texaspokerlearning/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pokergto = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tools", "tests"]
extend-exclude = ["site", "trainer"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "N", "D", "PTH", "ANN", "TRY", "PL",
]
ignore = [
  "D203", "D213",           # docstring style: prefer D200/D400 conventions
  "TRY003",                 # long messages on exceptions are fine in a teaching codebase;
                            # the explanation IS the pedagogy
  "PLR2004",                # magic-value comparison: the tests are literally about magic values
  "ANN401",                 # Any is acceptable at the JSON-artifact boundary
  "E501",                   # line length: CJK prose and LaTeX derivations need long lines
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "PLR2004", "S101"]
"tools/*" = ["D", "ANN", "TRY", "PLR0913", "PLR0912", "PLR0915"]
"src/pokergto/cli.py" = ["D", "PLR0912", "PLR0915"]
"src/pokergto/solver/proofs.py" = ["D"]
"src/pokergto/theory/*" = ["D"]
"__init__.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/pokergto"]
mypy_path = "src"
# tools/ and tests/ are type-checked loosely: they are build glue and assertions.
exclude = "^(trainer|site|build)/"

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: takes more than a few seconds; excluded from the default dev loop and pre-commit",
  "solver: exercises the CFR solver and its exploitability gates",
  "docs: reads or regenerates docs/ or data/gen/ artifacts",
]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["src/pokergto"]
omit = ["src/pokergto/cli.py", "src/pokergto/render.py"]

[tool.coverage.report]
show_missing = true
# engine + theory carry the 90% gate (enforced in CI); cli/render are omitted above because
# they are presentation, and coverage there would be theatre.
fail_under = 0

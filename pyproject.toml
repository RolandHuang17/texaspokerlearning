[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokergto"
version = "0.1.0"
description = "A bilingual, runnable GTO first-principles curriculum for no-limit Texas Hold'em: every number is derived, not asserted."
readme = "README.md"
requires-python = ">=3.11"
# Code is MIT; prose and data are CC BY-SA 4.0. See NOTICE for the split and the
# "no proprietary solver output" rule.
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Roland Huang", email = "roland.huang@example.com" },
]
keywords = ["poker", "texas-holdem", "gto", "game-theory", "cfr", "icm", "education", "bilingual"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment :: Board Games",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6",
  "jsonschema>=4",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4",
  "ruff>=0.4",
  "mypy>=1.8",
  "pre-commit>=3.6",
  # mypy runs with strict = true on the package, so the stubs for the two untyped dependencies it
  # imports are part of the toolchain, not optional extras.
  "types-PyYAML>=6",
  "types-jsonschema>=4",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "pymdown-extensions>=10",
]
plot = [
  "matplotlib>=3.8",
]

[project.scripts]
poker = "pokergto.cli:main"

[project.urls]
Homepage = "https://github.com/RolandHuang17/texaspokerlearning"
Repository = "https://github.com/RolandHuang17/texaspokerlearning"
Documentation = "https://RolandHuang17.github.io/texaspokerlearning/"
Issues = "https://github.com/RolandHuang17/texaspokerlearning/issues"
Changelog = "https://github.com/RolandHuang17/texaspokerlearning/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pokergto = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tools", "tests"]
extend-exclude = ["site", "trainer"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "N", "D", "PTH", "ANN", "TRY", "PL",
]
ignore = [
  "D203", "D213",           # docstring style: prefer D200/D400 conventions
  "D1",                     # missing docstrings: this codebase documents heavily, but by convention
                            # and review, not by lint. Forcing a docstring on every dunder or accessor
                            # produces text that restates the signature, which is worse than none.
  "TRY003",                 # long messages on exceptions are fine in a teaching codebase;
                            # the explanation IS the pedagogy
  "PLR2004",                # magic-value comparison: the tests are literally about magic values
  "ANN401",                 # Any is acceptable at the JSON-artifact boundary
  "E501",                   # line length: CJK prose and LaTeX derivations need long lines
  "PLR0911", "PLR0912", "PLR0915",  # complexity caps: the evaluator's and solver's branch count is the
                                    # rule itself written out. Compressing "straight flush, then quads,
                                    # then boat ..." into fewer branches would make it harder to check
                                    # against the rules of poker, which is the only job this code has.
  "C401", "RUF005", "RUF007", "SIM105", "SIM108", "SIM103",  # micro-style rewrites; readability here is
                                    # intentionally spelled out for learners reading the source
  "N818",                 # BudgetExceeded is a refusal, not a failure: naming it ...Error would imply
                                    # the caller did something wrong when the answer is "ask differently"
  "D205",                   # our docstrings open with a full-sentence summary that runs straight into
                            # prose; every module here is multi-paragraph by design, and adding a
                            # blank line after line one is formatting, not documentation
  "PLR0913", "PLR0917",     # many-argument signatures: the derived-principle functions in theory/ take
                            # (pot, bet, ranges, board, seed) because that is what the formula contains
  "PLC0415",                # deferred imports are deliberate: tools import the engine lazily so a
                            # missing dependency degrades one command, not the whole CLI
  # --- CJK-specific: the three RUF00x rules flag full-width punctuation (，：；（）) as "ambiguous
  # unicode characters". In a repository whose entire purpose is Chinese/English parity side by side,
  # that is not a hazard to catch but a language to write in.
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "PLR2004", "S101"]
"tools/*" = ["D", "ANN", "TRY", "PLR0913", "PLR0911", "PLR0912", "PLR0915"]
"src/pokergto/cli.py" = ["D", "PLR0911", "PLR0912", "PLR0915"]
"src/pokergto/solver/proofs.py" = ["D"]
"src/pokergto/theory/*" = ["D"]
"src/pokergto/solver/*" = ["PLR0911", "PLR0912"]
"__init__.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# numpy's generic parameters (ndarray[Any, dtype[Any]]) add ceremony without catching a single real
# bug in this codebase, and strict mode demands them everywhere. Everything else in strict stays on.
disallow_any_generics = false
files = ["src/pokergto"]
mypy_path = "src"
# ``tools/`` is deliberately outside mypy's scope: the scripts import ``pokergto`` after a runtime
# sys.path bootstrap that a static checker cannot follow, they are never imported by anyone else, and
# their correctness is enforced where it matters -- their own output is schema-validated and
# byte-compared by ``tools/gen_all.py --check``. They are linted by ruff and executed in CI.
exclude = "^(trainer|site|build)/"

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: takes more than a few seconds; excluded from the default dev loop and pre-commit",
  "solver: exercises the CFR solver and its exploitability gates",
  "docs: reads or regenerates docs/ or data/gen/ artifacts",
]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["src/pokergto"]
omit = ["src/pokergto/cli.py", "src/pokergto/render.py"]

[tool.coverage.report]
show_missing = true
# engine + theory carry the 90% gate (enforced in CI); cli/render are omitted above because
# they are presentation, and coverage there would be theatre.
fail_under = 0

name: CI

# Every step below is a command that exists in this repository and was run locally before being
# written here (see docs/development/local-dev.md for the verified state of each gate). Where a gate
# cannot be gating yet because the content it guards is still being authored, that is said in a comment
# next to the step rather than hidden behind `|| true`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pushed pull request replaces the previous one; a push to main never does, because the run that
# just started is the one that will become the deployed docs site.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  # Mirrors pyproject's `filterwarnings = ["error::DeprecationWarning"]`, so a deprecation surfaces in
  # CI rather than at the next dependency bump.
  PYTHONWARNINGS: error::DeprecationWarning

jobs:
  lint:
    name: lint (ruff, mypy, dependency lists)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-env

      # requirements-dev.txt exists so a contributor can get the toolchain without an editable
      # install. It duplicates pyproject's dev + docs extras, and the duplication is only safe if the
      # two are compared automatically -- requirements-dev.txt's own header promises this step.
      - name: requirements-dev.txt matches pyproject extras
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re, sys, tomllib

          py = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          declared = list(py["project"]["dependencies"])
          for extra in ("dev", "docs"):
              declared += py["project"]["optional-dependencies"][extra]

          lines = pathlib.Path("requirements-dev.txt").read_text(encoding="utf-8").splitlines()
          mirrored = [line.strip() for line in lines if line.strip() and not line.strip().startswith("#")]


          def canonical(requirement: str) -> tuple[str, str]:
              parts = re.split(r"(>=|<=|==|~=|>|<)", requirement.strip(), maxsplit=1)
              return parts[0].strip().lower().replace("_", "-"), "".join(parts[1:]).strip()


          left = {canonical(entry): entry for entry in declared}
          right = {canonical(entry): entry for entry in mirrored}
          problems = [f"missing from requirements-dev.txt: {name}" for name, _ in left if (name, _ not in 0)]
          problems = []
          for key, text in left.items():
              if key not in right:
                  problems.append(f"{text} is in pyproject but not in requirements-dev.txt")
          for key, text in right.items():
              if key not in left:
                  problems.append(f"{text} is in requirements-dev.txt but not in pyproject extras")
              elif left[key] != text:
                  problems.append(f"version spec differs: pyproject {left[key]!r} vs requirements {text!r}")
          if problems:
              print("::error::requirements-dev.txt and pyproject.toml have diverged")
              for problem in sorted(problems):
                  print(f"  {problem}")
              sys.exit(1)
          print(f"ok   {len(left)} requirement declarations agree")
          PY

      # Measured 2026-10-07, ruff 0.16.10: `ruff check .` reports **zero** findings across src/, tools/
      # and tests/, and `ruff format --check .` would reformat 14 of 161 files. Both steps stay
      # continue-on-error for one reason that is not laziness: `ruff>=0.4` in pyproject.toml is a floor,
      # so CI resolves whatever ruff ships tomorrow, and a blocking gate on an unpinned linter turns every
      # future release into a red build for every open pull request. The fix is to pin ruff (and mypy) in
      # the dev extra, then block -- tracked as a 1.0-hardening item, not a standing ambiguity.
      - name: ruff check
        shell: bash
        continue-on-error: true
        run: python -m ruff check . --no-cache --output-format=github

      - name: ruff format (report only)
        shell: bash
        continue-on-error: true
        run: python -m ruff format --check .

      # Measured 2026-10-07, mypy 1.10.0, strict over src/pokergto: **zero** errors in 30 files. The M0
      # note here claimed 59 in 14 files; that backlog is gone, including the numpy `ndarray` generic
      # noise, which is why the package casts at the few array boundaries where it pays instead of
      # parameterising every signature (see pyproject's disallow_any_generics = false). Same unpinned-tool
      # caveat as above, so this stays report-only until mypy is pinned.
      - name: mypy
        shell: bash
        continue-on-error: true
        run: python -m mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.11 is the floor pyproject declares, so it is tested on the two platforms contributors
          # actually use. 3.12 adds macOS because the trainer and the docs build get developed there.
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
            coverage: true
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python }}

      - name: Fast suite (pytest -m "not slow")
        shell: bash
        run: python -m pytest -m "not slow"

      # One arm carries the whole cost: the 2,598,960-hand enumeration (roughly 80 s for the full suite
      # locally) and the coverage gate. On ubuntu because a coverage report has to be comparable across
      # runs, and because path separators make `--cov=src/pokergto` fussier on Windows.
      - name: Full suite with the 90% coverage gate
        if: matrix.coverage
        shell: bash
        run: python -m pytest --cov=src/pokergto --cov-report=term --cov-report=xml --cov-fail-under=90

      - name: Upload coverage report
        if: matrix.coverage && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: warn

  solver:
    name: solver proof gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-env

      # Re-solves every game in src/pokergto/solver/proofs.py and compares bytes against the committed
      # artifacts in data/gen/solver. Deliberately not `--quick`: quick mode is a local loop and fails
      # this comparison by design (fewer iterations, different strategy), which is why the tool prints
      # a warning for it. Verified locally at roughly 90 s for the four registered games.
      - name: Committed solver artifacts still match a fresh solve
        shell: bash
        run: python tools/run_solver.py --check

      # What the proofs are allowed to cost. A valid solve that takes eleven minutes is still a bad
      # teaching artifact, and scope slides one street at a time; tools/cost_probe.py carries the
      # per-family budget and fails when a game exceeds it or has none declared at all (adr/0002).
      - name: Solver cost budget
        shell: bash
        run: python tools/cost_probe.py

      # The solver marker is carried by tests/test_solver.py (canonical Kuhn shape, the analytic
      # -1/18, CFR+ beating CFR, best response against a brute force over pure strategies,
      # solver-vs-algebra per bet size, byte-identical reruns, a proof gate shown able to fail) and by
      # tests/test_solver_vector.py, which holds the vectorised form to machine-epsilon agreement with
      # the textbook form under plain regret matching -- the admission control for the faster
      # implementation, because a vectorised CFR has previously converged here to something stable that
      # was not an equilibrium.
      - name: Solver behaviour tests
        shell: bash
        run: python -m pytest -m solver -q

  data:
    name: generated data contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-env

      - name: Every artifact validates against data/schema
        shell: bash
        run: python tools/check_artifact_schema.py

      # The per-push tier for the sampled preflop matrix (adr/0008). It re-derives batch 0 of the artifact's own
      # declared seed -- 1,000 boards, a measured 23 s -- and compares it byte for byte against
      # `sampling.first_batch_sha256`, then re-derives every identity the file claims from its committed cells.
      # What it does NOT prove is the full 20,000-board re-derivation, which measures 465-499 s and belongs to
      # `solver-regression.yml`; the step below carries the matrix's committed bytes rather than re-running its
      # engine. Say the boundary out loud, because a gate whose scope is unstated gets read as stronger than it is.
      - name: Preflop matrix re-derives its first batch
        shell: bash
        run: python tools/gen_preflop.py --verify

      - name: Every strategy claim declares provenance
        shell: bash
        run: python tools/check_provenance.py

      # The quiz bank's answer key is not allowed to be typed: this recomputes every stored answer from
      # the engine function the item names and fails on drift, so a corrected formula cannot leave a
      # stale number being drilled. It also refuses a non-finite or out-of-domain answer, which is the
      # shape a broken generator produces.
      - name: Quiz answers are computed, not typed
        shell: bash
        run: python tools/check_quiz_answers.py

      # `data/src/glossary.yaml` is exempt inside that tool: it is a terminology authority whose schema
      # forbids extra properties, so a `provenance` block cannot be attached to a term at all. The
      # generated artifact it feeds (glossary.json) is provenance-carrying and is validated by the
      # schema job above, which is where a terminology claim should be checked anyway.
      - name: data/gen is byte-identical to a fresh generation (slow steps carried, not re-derived)
        shell: bash
        run: python tools/gen_all.py --check

      # Unfiltered, and it used to need two skips. Both reasons are gone and both are now asserted
      # rather than hoped for: `gen_all._step_solver` passes `--out <temp>/solver` so solver artifacts
      # land where the committed tree keeps them, and `manifest.json` records content only -- digests,
      # `schema_version`, `engine_version` -- while interpreter, numpy and commit sha go to the build
      # log. A committed, byte-compared file that named the commit it came from could never agree with
      # CI's HEAD.
      #
      # One step is deliberately not re-derived here: `preflop`, at a measured 465-499 s. `gen_all` carries its
      # committed bytes into the rebuilt tree so the manifest and the staleness scan still describe a complete
      # tree, and refuses the run outright if the artifact is missing -- "skipped" must never read as "deleted".
      # The full re-derivation is `solver-regression.yml`'s job, and the per-push proof of the engine behind
      # those bytes is the `gen_preflop.py --verify` step above.

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-env

      # --strict turns mkdocs warnings (broken relative links, a nav entry pointing at a missing file,
      # an asset outside docs_dir) into errors, which is the only reason the link graph of a bilingual
      # tree stays honest as it grows.
      - name: mkdocs build --strict
        shell: bash
        run: python -m mkdocs build --strict

  bilingual:
    name: bilingual parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-env

      - name: en/zh mirror, template shape, AUTO ids, registered terms
        shell: bash
        run: python tools/check_bilingual.py --verbose

      - name: No hand-edited number inside an AUTO block
        shell: bash
        run: python tools/inject_doc_tables.py --check

  trainer:
    name: trainer build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Guarded by existence, not by a date: a workflow that fails because a directory has not been
      # written is a workflow nobody trusts, so a fork without a trainer reports "skipped, by design"
      # and stays green. `trainer/` itself landed in M3.
      - name: Detect the trainer
        id: probe
        shell: bash
        run: echo "present=$([ -f trainer/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up environment
        if: steps.probe.outputs.present == 'true'
        uses: ./.github/actions/setup-env
        with:
          with-node: 'true'

      # The trainer's contract with the data it consumes is ADR-0004: it reads committed artifacts and
      # nothing else. This proves the bundle would be built against exactly the artifacts in data/gen,
      # so a chart cannot quietly render a number an older engine wrote.
      - name: Trainer data matches data/gen
        if: steps.probe.outputs.present == 'true'
        shell: bash
        run: python tools/sync_trainer_data.py --check

      - name: Install and test
        if: steps.probe.outputs.present == 'true'
        shell: bash
        working-directory: trainer
        run: |
          npm ci
          npm test --if-present

      - name: Build
        if: steps.probe.outputs.present == 'true'
        shell: bash
        working-directory: trainer
        run: npm run build --if-present

      - name: Trainer not authored yet
        if: steps.probe.outputs.present != 'true'
        shell: bash
        run: echo "::notice::trainer/package.json absent -- skipping the trainer job (adr/0004)"

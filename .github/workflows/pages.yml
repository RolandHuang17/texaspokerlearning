name: Deploy GitHub Pages

# Docs at the site root, trainer at /trainer/. One Pages artifact, one domain, so the language
# switcher and the cross-links between docs and trainer keep working.
#
# The trainer is optional *by design*: it is milestone M3 and the docs must not go dark because it is
# absent. The job below checks for trainer/package.json and skips the trainer build when it is not
# there, rather than failing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-env
        with:
          with-node: 'true'

      # Pages is a repository setting, not a file in the tree, and until it is switched on the deployment job
      # below has nowhere to publish to. A gate that fails because of a settings toggle nobody has flipped is a
      # gate people learn to ignore, which is the mistake ci.yml avoids for trainer/ by probing instead of
      # assuming. So ask, publish the answer as a notice, and keep the run green.
      - name: Probe whether Pages is enabled
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq '.build_type' >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repository, so nothing is deployed. To turn it on: gh api repos/${{ github.repository }}/pages -X POST -f build_type=workflow"
          fi
      # Write mode, unfiltered, and deliberately without `--include-slow`: the eight-minute preflop matrix is not
      # re-derived here (adr/0008), so the deploy keeps the committed artifact's bytes -- which are the ones the
      # `data` job in `ci.yml` just verified, and the ones the trainer bundle ships. Pages pays seconds, not
      # minutes, for a number nobody changed.
      - name: Generate data and nav
        run: python tools/gen_all.py
      - name: Build docs
        run: python -m mkdocs build --strict
      - name: Build trainer (if it exists yet)
        id: trainer
        shell: bash
        run: |
          if [ -f trainer/package.json ]; then
            npm --prefix trainer ci
            npm --prefix trainer run build
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Trainer not present; publishing docs only." >> "$GITHUB_STEP_SUMMARY"
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Assemble site
        shell: bash
        run: |
          mkdir -p _site
          cp -r site/. _site/
          if [ '${{ steps.trainer.outputs.built }}' = 'true' ]; then
            mkdir -p _site/trainer && cp -r trainer/dist/. _site/trainer/
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # Skipped, not failed, while Pages is off -- see the probe in the build job. The artifact of this run is
    # still uploaded; enabling Pages is the only missing step, and the notice says how.
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.out.outputs.page_url }}
    steps:
      - id: out
        uses: actions/deploy-pages@v5

  notice:
    needs: build
    if: needs.build.outputs.pages_enabled != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Pages not enabled yet
        shell: bash
        run: |
          echo "::notice::GitHub Pages is not enabled for ${{ github.repository }} -- the site was built and uploaded, nothing was deployed. Enable it once CI is green: gh api repos/${{ github.repository }}/pages -X POST -f build_type=workflow"
